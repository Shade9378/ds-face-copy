[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "face-to-slider"
version = "0.1.0"
description = "Local face analysis for a calibrated Souls character creation pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "opencv-contrib-python>=4.11,<5", "Pillow>=10,<13",
  "pydantic>=2.8,<3", "mediapipe>=0.10.20,<0.11", "gradio>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
optimization = ["torch>=2.4", "scipy>=1.14", "cma>=4"]

[project.scripts]
face-to-slider = "ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/preprocessing", "src/ui", "src/games", "src/reconstruction"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
